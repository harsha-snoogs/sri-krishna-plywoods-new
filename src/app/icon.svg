<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A3426" />
      <stop offset="100%" stop-color="#281A12" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E6CC" />
      <stop offset="50%" stop-color="#C2A36B" />
      <stop offset="100%" stop-color="#947438" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Gold Border -->
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.35"/>

  <!-- Aesthetic Layered Wood / Plywood Emblem -->
  <g filter="url(#shadow)">
    <!-- Layer 1: Left Plank -->
    <rect x="156" y="140" width="46" height="190" rx="10" fill="url(#goldGrad)" opacity="0.8"/>
    <!-- Layer 2: Center Tall Core Plank -->
    <rect x="226" y="90" width="60" height="240" rx="12" fill="url(#goldGrad)"/>
    <!-- Layer 3: Right Plank -->
    <rect x="310" y="170" width="46" height="160" rx="10" fill="url(#goldGrad)" opacity="0.75"/>
    
    <!-- Base Layered Plywood Sheet Base -->
    <path d="M 136 345 L 256 375 L 376 345 L 376 365 L 256 395 L 136 365 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Monogram Brand Text -->
  <text x="256" y="455" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" text-anchor="middle" fill="url(#goldGrad)" letter-spacing="14">SKPH</text>
</svg>
